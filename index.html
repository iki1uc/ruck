<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ IKI1UC · RUN21 · Aggregator PRO</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0a0a0f;
      color:#e6e9ef;
      font-family:'Consolas','Segoe UI',monospace;
      padding:20px;
      min-height:100vh;
    }
    .wrap { max-width:1400px; margin:0 auto; }

    header {
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      padding-bottom:12px;
      border-bottom:2px solid #2a2e36;
    }
    header h1 {
      font-size:28px;
      font-weight:700;
      background:linear-gradient(135deg,#ff4d4d,#ffd700,#4da6ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    header .sub { font-size:13px; color:#6a6f7a; }

    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:16px;
      align-items:center;
    }
    .toolbar input {
      flex:1;
      min-width:180px;
      padding:10px 14px;
      background:#14171e;
      border:1px solid #2a2e36;
      border-radius:8px;
      color:#e6e9ef;
      font-size:13px;
      outline:none;
    }
    .toolbar input:focus { border-color:#4da6ff; }
    .toolbar .badge {
      background:#14171e;
      padding:4px 12px;
      border-radius:20px;
      font-size:12px;
      color:#8a8f9a;
      border:1px solid #2a2e36;
    }
    .toolbar .badge span { color:#e6e9ef; font-weight:600; }
    .toolbar .badge .dot {
      display:inline-block;
      width:8px; height:8px; border-radius:50%; margin-right:6px;
    }
    .badge-fire .dot { background:#ff4d4d; }
    .badge-ice .dot { background:#4da6ff; }
    .badge-ort .dot { background:#66ff99; }

    .energy-bar {
      background:#14171e;
      border-radius:8px;
      height:8px;
      margin-bottom:20px;
      overflow:hidden;
      border:1px solid #2a2e36;
      position:relative;
    }
    .energy-bar .fill {
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#ff4d4d,#ffd700,#4da6ff);
      transition:width 0.5s ease;
      box-shadow:0 0 20px #4da6ff55;
    }
    .energy-bar .label {
      position:absolute;
      right:10px; top:-2px;
      font-size:10px; color:#6a6f7a;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:16px;
      margin-bottom:20px;
    }
    @media(max-width:1000px){ .grid { grid-template-columns:1fr 1fr; } }
    @media(max-width:680px){ .grid { grid-template-columns:1fr; } }

    .panel {
      background:#14171e;
      border:1px solid #2a2e36;
      border-radius:12px;
      padding:14px;
      max-height:450px;
      overflow-y:auto;
    }
    .panel.fire { border-top:3px solid #ff4d4d; }
    .panel.ice { border-top:3px solid #4da6ff; }
    .panel.ort { border-top:3px solid #66ff99; }
    .panel h2 {
      font-size:13px;
      margin-bottom:8px;
      display:flex;
      justify-content:space-between;
      color:#8a8f9a;
    }
    .panel h2 .count { font-weight:400; color:#5a5f6a; }

    .module-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:5px 0;
      border-bottom:1px solid #1e2229;
      font-size:12px;
      gap:6px;
    }
    .module-item:last-child { border-bottom:none; }
    .module-item .info {
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }
    .module-item .name { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .module-item .path { font-size:9px; color:#5a5f6a; }
    .module-item .status {
      width:10px; height:10px; border-radius:50%; flex-shrink:0;
    }
    .status.online { background:#4da6ff; box-shadow:0 0 8px #4da6ff44; }
    .status.offline { background:#ff4d4d; box-shadow:0 0 8px #ff4d4d44; }
    .status.build {
      background:#ffd700;
      animation:pulse 0.8s infinite alternate;
      box-shadow:0 0 14px #ffd70088;
    }
    @keyframes pulse {
      0% { opacity:0.3; transform:scale(0.8); }
      100% { opacity:1; transform:scale(1.2); }
    }

    .module-item .actions {
      display:flex;
      gap:4px;
      flex-shrink:0;
    }
    .module-item .actions button {
      background:#2a2e36;
      border:none;
      color:#e6e9ef;
      padding:2px 8px;
      border-radius:4px;
      font-size:9px;
      cursor:pointer;
      transition:background 0.2s;
    }
    .module-item .actions button:hover { background:#4da6ff; color:#0a0a0f; }
    .module-item .actions button.toggle {
      background:#1a1d23;
      border:1px solid #2a2e36;
    }
    .module-item .actions button.toggle:hover { border-color:#4da6ff; }

    .empty { color:#5a5f6a; font-size:12px; padding:8px 0; text-align:center; }

    .footer {
      margin-top:20px;
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      justify-content:center;
      padding:12px;
      background:#14171e;
      border-radius:12px;
      border:1px solid #2a2e36;
      font-size:12px;
      color:#6a6f7a;
    }
    .footer .stat { display:flex; align-items:center; gap:6px; }
    .footer .stat .dot { width:10px; height:10px; border-radius:50%; }
    .footer .stat .dot.online { background:#4da6ff; }
    .footer .stat .dot.offline { background:#ff4d4d; }
    .footer .stat .dot.build { background:#ffd700; }
    .footer .tick { color:#ffd700; font-weight:600; min-width:40px; }

    .log-panel {
      margin-top:16px;
      background:#14171e;
      border:1px solid #2a2e36;
      border-radius:12px;
      padding:12px;
      max-height:200px;
      overflow-y:auto;
      font-size:11px;
      color:#8a8f9a;
    }
    .log-panel .entry { padding:2px 0; border-bottom:1px solid #1e2229; }
    .log-panel .entry .time { color:#5a5f6a; }
    .log-panel .entry .msg { color:#e6e9ef; }
    .log-panel .entry .msg.build { color:#ffd700; }
    .log-panel .entry .msg.online { color:#4da6ff; }
    .log-panel .entry .msg.offline { color:#ff4d4d; }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:#14171e; }
    ::-webkit-scrollbar-thumb { background:#2a2e36; border-radius:4px; }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>⚡ IKI1UC · RUN21 · Aggregator PRO</h1>
    <span class="sub">Konsistent · Live‑Log · Echte Energie</span>
  </header>

  <div class="toolbar">
    <input id="searchInput" placeholder="🔍 Modul suchen (Name, Pfad) …">
    <div class="badge">📦 <span id="totalCount">0</span></div>
    <div class="badge badge-fire"><span class="dot"></span>🔥 <span id="fireCount">0</span></div>
    <div class="badge badge-ice"><span class="dot"></span>❄️ <span id="iceCount">0</span></div>
    <div class="badge badge-ort"><span class="dot"></span>🌍 <span id="ortCount">0</span></div>
    <button id="buildToggle" style="background:#2a2e36;border:none;color:#e6e9ef;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;">⏱ Build‑Tick</button>
    <button id="logClear" style="background:#1a1d23;border:1px solid #2a2e36;color:#6a6f7a;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;">🗑 Log</button>
  </div>

  <div class="energy-bar">
    <div class="fill" id="energyFill"></div>
    <span class="label" id="energyPercent">0%</span>
  </div>

  <div class="grid">
    <div class="panel fire"><h2>🔥 FIRE <span class="count" id="fireLabel">0</span></h2><div id="fireList"></div></div>
    <div class="panel ice"><h2>❄️ ICE <span class="count" id="iceLabel">0</span></h2><div id="iceList"></div></div>
    <div class="panel ort"><h2>🌍 ORT <span class="count" id="ortLabel">0</span></h2><div id="ortList"></div></div>
  </div>

  <div class="footer">
    <div class="stat"><span class="dot online"></span> Online: <span id="onlineCount">0</span></div>
    <div class="stat"><span class="dot offline"></span> Offline: <span id="offlineCount">0</span></div>
    <div class="stat"><span class="dot build"></span> Building: <span id="buildCount">0</span></div>
    <div class="stat">⏱ Tick: <span class="tick" id="tickDisplay">0</span></div>
    <div class="stat">⚡ Energie: <span id="energyFooter">0%</span></div>
  </div>

  <div class="log-panel" id="logPanel">
    <div style="color:#5a5f6a;font-size:11px;">📜 Live‑Log</div>
    <div id="logContent"></div>
  </div>

</div>

<script>
// ================================================================
// 1. MODUL‑LISTE (aus api/, markt/, ort/ – basierend auf Files.txt)
// ================================================================
const MODULE_NAMES = [
  "3hit90.js","3×1.js","3×3.js","81.build","81.rom","81.scan","81.tmp","81.video",
  "9.tmp","9×9.js","ANKER.rom","ANKER.room","ANKER.scan","ANKER.tmp","CODEOWNERS.md",
  "CONTRIBUTING.md","ID.json","LICENSE-CLOSED.txt","NO1.room","README.md","TMP.tmp",
  "anker.js","api.js","arbeit.js","atom.raw.js","build.js","cache.js","cache.raw.js",
  "call.js","clock.js","corridoor.js","cpu.js","cpu.raw.js","echo.zahn.js",
  "energie.raw.js","flanke.js","geo.js","gleichung.js","gpu.js","gpu.raw.js",
  "hall.rad.js","index.html","mac.js","mass.js","pipe.js","pipe.pipeline.js",
  "rad.js","raid.pipeline.js","ram.js","ram.raw.js","recall.js","respo360.js",
  "respoDashboard.js","rom.js","rom.raw.js","run.over","schuss.js","scsi.raid",
  "sli.markt","stage.js","stage.pipeline.js","status.json","time.js","use.js",
  "user.js","verfahren.js","work.js","zahn.js","ziel.js",
  // ort/
  "3hoch3_respos.json","9hoch9_respos (6).json","NC.room","aggregator.js",
  "atom-functions-payload.json","continuum-6x6.json","continuum-reality.json",
  "index.html","index‑aggregator.html","interpretation-2268 (3).json",
  "quant-triangle-analysis.json"
];

const MODULES = [];
function detectCategory(name) {
  const l = name.toLowerCase();
  if (l.includes('pipeline') || l.includes('pipe.')) return 'fire';
  if (l.includes('raw') || l.includes('rom') || l.includes('ram') || l.includes('cpu') ||
      l.includes('gpu') || l.includes('cache') || l.includes('energie')) return 'ice';
  return 'ort';
}

// Module aus api/, markt/, ort/ generieren
MODULE_NAMES.forEach(n => {
  // api/
  if (!n.includes('3hoch3') && !n.includes('9hoch9') && !n.includes('NC.room') &&
      !n.includes('aggregator.js') && !n.includes('atom-functions') &&
      !n.includes('continuum') && !n.includes('interpretation') && !n.includes('quant-triangle') &&
      !n.includes('index‑aggregator') && n !== 'index.html') {
    MODULES.push({ name: n, path: 'api/' + n, category: detectCategory(n), status: 'online' });
  }
  // markt/
  if (!n.includes('3hoch3') && !n.includes('9hoch9') && !n.includes('NC.room') &&
      !n.includes('aggregator.js') && !n.includes('atom-functions') &&
      !n.includes('continuum') && !n.includes('interpretation') && !n.includes('quant-triangle') &&
      !n.includes('index‑aggregator') && n !== 'index.html') {
    MODULES.push({ name: n, path: 'markt/' + n, category: detectCategory(n), status: 'online' });
  }
  // ort/ (nur spezielle)
  if (n.includes('3hoch3') || n.includes('9hoch9') || n.includes('NC.room') ||
      n.includes('aggregator.js') || n.includes('atom-functions') ||
      n.includes('continuum') || n.includes('interpretation') || n.includes('quant-triangle') ||
      n.includes('index‑aggregator')) {
    MODULES.push({ name: n, path: 'ort/' + n, category: 'ort', status: 'online' });
  }
});

// ================================================================
// 2. STATE
// ================================================================
let buildTick = 0;
let buildInterval = null;
let isBuilding = false;
let tickCounter = 0;

// ================================================================
// 3. LOG
// ================================================================
function log(msg, type = '') {
  const content = document.getElementById('logContent');
  const time = new Date().toLocaleTimeString('de-DE');
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${type}">${msg}</span>`;
  content.prepend(entry);
  while (content.children.length > 80) content.lastChild?.remove();
}

// ================================================================
// 4. RENDER
// ================================================================
function render(filter = '') {
  const f = filter.toLowerCase().trim();
  const filtered = MODULES.filter(m =>
    m.name.toLowerCase().includes(f) || m.path.toLowerCase().includes(f)
  );

  const fire = filtered.filter(m => m.category === 'fire');
  const ice = filtered.filter(m => m.category === 'ice');
  const ort = filtered.filter(m => m.category === 'ort');

  document.getElementById('totalCount').textContent = filtered.length;
  document.getElementById('fireCount').textContent = fire.length;
  document.getElementById('iceCount').textContent = ice.length;
  document.getElementById('ortCount').textContent = ort.length;
  document.getElementById('fireLabel').textContent = fire.length;
  document.getElementById('iceLabel').textContent = ice.length;
  document.getElementById('ortLabel').textContent = ort.length;

  const online = filtered.filter(m => m.status === 'online').length;
  const offline = filtered.filter(m => m.status === 'offline').length;
  const building = filtered.filter(m => m.status === 'build').length;
  document.getElementById('onlineCount').textContent = online;
  document.getElementById('offlineCount').textContent = offline;
  document.getElementById('buildCount').textContent = building;

  // Energie (einheitlich)
  const energy = Math.min(100, Math.round((online / (filtered.length || 1)) * 60 + building * 8 + 10));
  document.getElementById('energyFill').style.width = energy + '%';
  document.getElementById('energyPercent').textContent = energy + '%';
  document.getElementById('energyFooter').textContent = energy + '%';

  const renderList = (arr, target) => {
    const el = document.getElementById(target);
    el.innerHTML = arr.length
      ? arr.map(m => moduleHTML(m)).join('')
      : '<div class="empty">—</div>';
  };
  renderList(fire, 'fireList');
  renderList(ice, 'iceList');
  renderList(ort, 'ortList');
}

function moduleHTML(m) {
  return `
    <div class="module-item">
      <div class="info">
        <span class="name">${m.name}</span>
        <span class="path">${m.path}</span>
      </div>
      <span class="status ${m.status}"></span>
      <div class="actions">
        <button onclick="startModule('${m.name.replace(/'/g, "\\'")}')">▶</button>
        <button class="toggle" onclick="toggleStatus('${m.name.replace(/'/g, "\\'")}')">↻</button>
      </div>
    </div>
  `;
}

// ================================================================
// 5. AKTIONEN
// ================================================================
function startModule(name) {
  const mod = MODULES.find(m => m.name === name);
  if (!mod) return;
  mod.status = 'build';
  render(document.getElementById('searchInput').value);
  log(`▶ ${mod.path} gestartet … ⚡`, 'build');
  setTimeout(() => {
    mod.status = 'online';
    render(document.getElementById('searchInput').value);
    log(`✓ ${mod.path} erfolgreich`, 'online');
  }, 1500 + Math.random() * 1500);
}

function toggleStatus(name) {
  const mod = MODULES.find(m => m.name === name);
  if (!mod) return;
  mod.status = mod.status === 'online' ? 'offline' : 'online';
  render(document.getElementById('searchInput').value);
  log(`↻ ${mod.path} → ${mod.status}`, mod.status);
}

// ================================================================
// 6. BUILD‑TICK
// ================================================================
function toggleBuild() {
  if (isBuilding) {
    clearInterval(buildInterval);
    buildInterval = null;
    isBuilding = false;
    document.getElementById('buildToggle').textContent = '⏱ Build‑Tick';
    MODULES.forEach(m => { if (m.status === 'build') m.status = 'online'; });
    render(document.getElementById('searchInput').value);
    log('⏹ Build‑Tick gestoppt', 'offline');
    return;
  }
  isBuilding = true;
  document.getElementById('buildToggle').textContent = '⏹ Stop Build';
  buildTick = 0;
  document.getElementById('tickDisplay').textContent = '0';
  log('⏱ Build‑Tick gestartet', 'build');

  buildInterval = setInterval(() => {
    buildTick++;
    document.getElementById('tickDisplay').textContent = buildTick;
    MODULES.forEach(m => { if (m.status === 'build') m.status = 'online'; });
    const count = 1 + Math.floor(Math.random() * 3);
    const shuffled = [...MODULES].sort(() => Math.random() - 0.5);
    for (let i = 0; i < Math.min(count, shuffled.length); i++) {
      shuffled[i].status = 'build';
    }
    render(document.getElementById('searchInput').value);
  }, 1200);
}

// ================================================================
// 7. EVENTS
// ================================================================
document.getElementById('searchInput').addEventListener('input', function() {
  render(this.value);
});
document.getElementById('buildToggle').addEventListener('click', toggleBuild);
document.getElementById('logClear').addEventListener('click', () => {
  document.getElementById('logContent').innerHTML = '';
  log('🗑 Log geleert');
});

// Globale Funktionen für onclick
window.startModule = startModule;
window.toggleStatus = toggleStatus;

// ================================================================
// 8. INIT + AUTO‑TICK (Energiepuls)
// ================================================================
render('');
document.getElementById('tickDisplay').textContent = '0';
log('⚡ IKI1UC · RUN21 · Aggregator PRO geladen', 'online');
log(`📦 ${MODULES.length} Module erkannt (api/markt/ort)`, 'online');

// Zentraler Tick für Energie‑Puls (ohne Konflikt)
setInterval(() => {
  if (!isBuilding) {
    const current = parseFloat(document.getElementById('energyPercent').textContent) || 50;
    const r = Math.random() * 6 - 3;
    const newEnergy = Math.min(100, Math.max(5, current + r));
    document.getElementById('energyFill').style.width = newEnergy + '%';
    document.getElementById('energyPercent').textContent = Math.round(newEnergy) + '%';
    document.getElementById('energyFooter').textContent = Math.round(newEnergy) + '%';
  }
}, 3000);
</script>
</body>
</html>
