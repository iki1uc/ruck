<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKI1UC · RUN21 · Aggregator Dashboard</title>

<style>
  body { background:#0f1115; color:#e6e9ef; font-family:Consolas, monospace; padding:20px; }
  h1 { text-align:center; font-size:24px; margin-bottom:10px; }
  h2 { font-size:14px; margin-bottom:10px; color:#8a8f9a; }
  .wrap { max-width:1300px; margin:0 auto; }
  .search { width:100%; padding:10px; background:#1a1d23; border:1px solid #2a2e36; border-radius:8px; color:#e6e9ef; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .panel { background:#1a1d23; border:1px solid #2a2e36; border-radius:12px; padding:16px; }
  .module { padding:6px 0; border-bottom:1px solid #2a2e36; display:flex; justify-content:space-between; }
  .module:last-child { border-bottom:none; }
  .status { width:10px; height:10px; border-radius:50%; }
  .online { background:#4da6ff; }
  .btn { background:#4da6ff; color:#000; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; border:none; }
</style>
</head>

<body>

<h1>⚡ IKI1UC · RUN21 · Aggregator Dashboard</h1>

<div class="wrap">

  <input id="search" class="search" placeholder="🔍 Modul suchen …">

  <div class="grid">
    <div class="panel"><h2>🔥 FIRE</h2><div id="fireList"></div></div>
    <div class="panel"><h2>❄️ ICE</h2><div id="iceList"></div></div>
    <div class="panel"><h2>🌍 ORT</h2><div id="ortList"></div></div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h2>🚀 Pipeline‑Starter</h2>
    <div id="pipelineList"></div>
  </div>

</div>

<script type="module">
import { Aggregator } from "./aggregator.js";

function renderCategory(list, target) {
  document.getElementById(target).innerHTML =
    list.map(m => `
      <div class="module">
        <span>${m.name}<br><small>${m.path}</small></span>
        <span class="status online"></span>
      </div>
    `).join('');
}

function renderPipelines() {
  const list = Aggregator.modules.filter(m => m.name.includes("pipeline"));
  document.getElementById("pipelineList").innerHTML =
    list.map(m => `
      <div class="module">
        <span>${m.name}</span>
        <button class="btn" onclick="alert('Pipeline gestartet: ${m.name}')">Start</button>
      </div>
    `).join('');
}

function renderAll() {
  const S = Aggregator.status;
  renderCategory(S.fire, "fireList");
  renderCategory(S.ice, "iceList");
  renderCategory(S.ort, "ortList");
  renderPipelines();
}

Aggregator.init().then(renderAll);
</script>

</body>
</html>
